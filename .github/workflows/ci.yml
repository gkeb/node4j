name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Neo4j ${{ matrix.neo4j-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
        neo4j-version: ["2026.09.0", "5.26"]
    services:
      neo4j:
        image: neo4j:${{ matrix.neo4j-version }}
        env:
          NEO4J_AUTH: neo4j/test-password-123
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password-123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
    env:
      NODE4J_TEST_URI: bolt://127.0.0.1:7687
      NODE4J_TEST_USER: neo4j
      NODE4J_TEST_PASSWORD: test-password-123
      NODE4J_REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.20
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Test N1–N3 and TTL
        run: uv run --locked pytest -W error::ResourceWarning

      - name: Run demonstration script
        run: uv run --locked python -W error::ResourceWarning test.py

      - name: Check Ruff against the known baseline
        shell: bash
        run: |
          uv run --locked ruff check . --output-format=json > "$RUNNER_TEMP/ruff.json" || ruff_status=$?
          if [[ "${ruff_status:-0}" -gt 1 ]]; then
            cat "$RUNNER_TEMP/ruff.json"
            exit "$ruff_status"
          fi
          uv run --locked python scripts/check_ruff_baseline.py "$RUNNER_TEMP/ruff.json"

      - name: Build distribution
        run: uv build --out-dir "$RUNNER_TEMP/dist"

      - name: Install wheel outside the checkout and import the API
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          python -m venv --without-pip "$RUNNER_TEMP/install-env"
          uv pip sync --require-hashes --python "$RUNNER_TEMP/install-env/bin/python" "$RUNNER_TEMP/runtime-requirements.txt"
          uv pip install --no-deps --python "$RUNNER_TEMP/install-env/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/install-env/bin/python" - <<'PY'
          from importlib import import_module
          import sys
          from pathlib import Path

          public_modules = (
              "node4j",
              "node4j.db",
              "node4j.nodes",
              "node4j.query",
              "node4j.mixins",
              "node4j.managers",
              "node4j.properties",
              "node4j.edges",
              "node4j.ext.apoc",
              "node4j.ext.gds",
          )
          for module in public_modules:
              import_module(module)

          package = import_module("node4j")
          assert Path(package.__file__).resolve().is_relative_to(
              Path(sys.prefix).resolve()
          )
          PY

  latest-pydantic:
    name: Latest Pydantic 2.x / Neo4j 2026.09
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.09.0
        env:
          NEO4J_AUTH: neo4j/test-password-123
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password-123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
    env:
      NODE4J_TEST_URI: bolt://127.0.0.1:7687
      NODE4J_TEST_USER: neo4j
      NODE4J_TEST_PASSWORD: test-password-123
      NODE4J_REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.20
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Upgrade to the latest Pydantic 2.x
        run: uv pip install --python .venv/bin/python --upgrade 'pydantic>=2,<3'

      - name: Test N1–N3 and TTL
        run: uv run --no-sync pytest -W error::ResourceWarning
