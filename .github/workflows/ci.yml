name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / Neo4j 2025.05.1
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2025.05.1
        env:
          NEO4J_AUTH: neo4j/test-password-123
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password-123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
    env:
      NODE4J_TEST_URI: bolt://127.0.0.1:7687
      NODE4J_TEST_USER: neo4j
      NODE4J_TEST_PASSWORD: test-password-123
      NODE4J_REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.20
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Test N1–N3 and TTL
        run: uv run --locked pytest

      - name: Check Ruff against the known baseline
        shell: bash
        run: |
          uv run --locked ruff check . --output-format=json > "$RUNNER_TEMP/ruff.json" || ruff_status=$?
          if [[ "${ruff_status:-0}" -gt 1 ]]; then
            cat "$RUNNER_TEMP/ruff.json"
            exit "$ruff_status"
          fi
          uv run --locked python scripts/check_ruff_baseline.py "$RUNNER_TEMP/ruff.json"

      - name: Build distribution
        run: uv build --out-dir "$RUNNER_TEMP/dist"

      - name: Install wheel outside the checkout and import the API
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          python -m venv --without-pip "$RUNNER_TEMP/install-env"
          uv pip sync --require-hashes --python "$RUNNER_TEMP/install-env/bin/python" "$RUNNER_TEMP/runtime-requirements.txt"
          uv pip install --no-deps --python "$RUNNER_TEMP/install-env/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/install-env/bin/python" -c 'import sys; from pathlib import Path; import node4j; from node4j.db import connection; from node4j.nodes import Node; from node4j.query import Q; assert Path(node4j.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'
